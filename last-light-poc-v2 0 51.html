  addBattleLog(G.activeMission.desc,'info');
  bondedPairsThisBattle.forEach(([n1,n2,count])=>{
    addBattleLog(`${n1} and ${n2} fight as one, bonded by ${count} missions together.`,'good');
  });
  newRoundOrder();
  G.screen='battle';
  return processTurns();
}

/* ---------------- BATTLE ---------------- */
function newRoundOrder(){
  G.battle.order = G.battle.units.filter(u=>u.alive)
    .map(u=>({u,key:u.init+Math.random()}))
    .sort((a,b)=>b.key-a.key).map(o=>o.u);
  G.battle.activeIndex=0;
}
function startNewRound(){
  G.battle.round++;
  if(G.battle.missionType==='purge'){
    checkPurgeHold();
    if(G.screen!=='battle') return; // hold check may have already ended the battle (e.g. loss)
  }
  if(G.battle.missionType==='cleanse'||G.battle.missionType==='traderoute'){
    checkCleanseHold();
    if(G.screen!=='battle') return;
  }
  if(G.battle.missionType==='templerite'||G.battle.missionType==='elysiumhunt'||G.battle.missionType==='agoratoll'){
    checkRiteHold();
    if(G.screen!=='battle') return;
  }
  const cap = (G.battle.missionType==='defense'||G.battle.missionType==='trial'||G.battle.missionType==='arenabout') ? G.battle.roundsRequired : 20;
  const wavesInType = G.battle.missionType==='defense'||G.battle.missionType==='purge'||G.battle.missionType==='explore'||G.battle.missionType==='relic'||G.battle.missionType==='stalk'||G.battle.missionType==='cleanse'||G.battle.missionType==='templerite'||G.battle.missionType==='packhunt'||G.battle.missionType==='elysiumhunt'||G.battle.missionType==='traderoute'||G.battle.missionType==='agoratoll'||G.battle.missionType==='trial'||G.battle.missionType==='arenabout';
  const purgeWavesStopped = G.battle.missionType==='purge' && G.battle.purgeSiteCleansed;
  // Stalk (and every region's Endless-X boss encounter, which shares this gating) waves
  // don't start until the elite's actually been found -- searching itself stays quiet,
  // but once you've engaged, reinforcements start closing in just like every other
  // sustained fight, so the elite can't just be facetanked alone.
  const stalkWavesNotStarted = (G.battle.missionType==='stalk'||G.battle.missionType==='templerite'||G.battle.missionType==='packhunt'||G.battle.missionType==='elysiumhunt'||G.battle.missionType==='agoratoll') && !G.battle.eliteSpawned;
  // Once the elite falls, reinforcements stop closing in too -- the mop-up is bounded to
  // whatever's already on the field, not an endless trickle while you clean up stragglers.
  const stalkWavesStopped = (G.battle.missionType==='stalk'||G.battle.missionType==='templerite'||G.battle.missionType==='packhunt'||G.battle.missionType==='elysiumhunt'||G.battle.missionType==='agoratoll') && G.battle.eliteDefeated;
  const ARENABOUT_MAX_WAVES = 4;
  const arenaboutCadenceOk = G.battle.missionType!=='arenabout' || G.battle.round%3===0;
  const arenaboutUnderCap = G.battle.missionType!=='arenabout' || (G.battle.arenaboutWavesSpawned||0) < ARENABOUT_MAX_WAVES;
  // Explore wave-pressure investigation (reverted): tested slowed cadence and wave caps
  // to bring the post-AI-fix win rate down toward sibling range. Found no smooth middle
  // ground -- waves fully present landed at ~53% avg (already below sibling range), any
  // dampening (cadence change OR cap, in any combination tried) jumped straight to
  // ~97-99%. The lever doesn't produce a graduated effect here since fights resolve
  // decisively either way. Reverted to original (uncapped, every-2 rounds, same as every
  // other wavesInType mission) -- reward multiplier respecced to match the AI-fix-only
  // difficulty instead of chasing a wave-pressure tune that wasn't working.
  const waveRoundHit = G.battle.missionType==='arenabout' ? arenaboutCadenceOk : G.battle.round%2===0;
  if(wavesInType && !purgeWavesStopped && !stalkWavesNotStarted && !stalkWavesStopped && arenaboutUnderCap && G.battle.round<=cap && waveRoundHit){
    spawnWave();
    if(G.battle.missionType==='arenabout') G.battle.arenaboutWavesSpawned = (G.battle.arenaboutWavesSpawned||0) + 1;
    addBattleLog(`Round ${G.battle.round} — the Darkness presses closer.`,'bad');
  }
  newRoundOrder();
}
function checkCleanseHold(){
  const unclaimed = G.battle.objectives.filter(o=>!o.claimed);
  if(!unclaimed.length) return;
  const isRoute = G.battle.missionType==='traderoute';
  let anyChanged = false;
  unclaimed.forEach(o=>{
    const held = G.battle.units.some(u=>u.side==='player'&&u.alive&&u.x===o.x&&u.y===o.y);
    if(held){
      o.holdRounds = (o.holdRounds||0) + 1;
      if(o.holdRounds>=1 && !o.claimed){
        o.claimed = true;
        anyChanged = true;
        addBattleLog(isRoute ? 'A route node flares back to life, and holds.' : 'A ward-circle flares back to life, and holds.','good');
      }
    } else if(o.holdRounds>0){
      addBattleLog(isRoute ? 'The node dims again — the hold was broken before it could catch.' : 'The ward dims again — the hold was broken before it could catch.','bad');
      o.holdRounds = 0;
    }
  });
  if(G.battle.objectives.every(o=>o.claimed) && unclaimed.length) addBattleLog(isRoute ? 'Every node along this stretch burns steady once more.' : 'Every ward in this chamber burns steady once more.','good');
  if(anyChanged) updateDiscovery(); // a newly-relit ward/node casts light immediately, not just on the next player move
}
function checkRiteHold(){
  if(G.battle.eliteSpawned || !G.battle.riteFound) return;
  const obj = G.battle.objectives[0];
  if(!obj) return;
  const held = G.battle.units.some(u=>u.side==='player'&&u.alive&&u.x===obj.x&&u.y===obj.y);
  if(held){
    G.battle.riteHoldRounds = (G.battle.riteHoldRounds||0) + 1;
    if(G.battle.riteHoldRounds>=1){
      obj.claimed = true;
      G.battle.eliteSpawned = true;
      const elite = spawnEliteNear(obj.x, obj.y, 7, G.battle.avgPartyTier, true);
      addBattleLog(`The rite completes on its own terms — ${elite.name} finally turns to face you.`,'bad');
    }
  } else {
    if(G.battle.riteHoldRounds>0) addBattleLog('You step back, and the rite resumes its endless repetition, unfinished.','bad');
    G.battle.riteHoldRounds = 0;
  }
}
function checkPurgeHold(){
  if(G.battle.purgeSiteCleansed) return;
  const obj = G.battle.objectives[0];
  if(!obj) return;
  const held = G.battle.units.some(u=>u.side==='player'&&u.alive&&u.x===obj.x&&u.y===obj.y);
  if(held){
    G.battle.purgeHoldRounds = (G.battle.purgeHoldRounds||0) + 1;
    addBattleLog(`The site is held. (${G.battle.purgeHoldRounds}/2 rounds)`,'good');
    if(G.battle.purgeHoldRounds>=2 && !G.battle.purgeSiteCleansed){
      obj.claimed=true;
      G.battle.purgeSiteCleansed=true;
      addBattleLog('The corruption\'s source is suppressed — no more will come. Clear what remains!','good');
      checkBattleEnd();
    }
  } else {
    if(G.battle.purgeHoldRounds>0) addBattleLog('The site slips from your grasp — the hold is broken.','bad');
    G.battle.purgeHoldRounds = 0;
  }
}
// Wave spawns should land opposite the player's actual entry edge, not a hardcoded
// side -- the spawn zone is randomly west/east/north/south (see generateSpawnZone), so
// the old fixed "always spawn in the far-east band" assumption put waves right next to
// or overlapping the entry area whenever the player spawned anywhere but west. Mirrors
// the original west-case band width (the far 40%-ish depth from the entry edge)
// exactly for all 4 directions rather than guessing a new width per edge.
function oppositeEdgePoint(){
  const edge = (G.battle.spawnZone && G.battle.spawnZone.edge) || 'west';
  const farX = GW-1-Math.floor(GW*0.6);
  const farY = GH-1-Math.floor(GH*0.6);
  if(edge==='west') return {x:rand(Math.floor(GW*0.6),GW-1), y:rand(0,GH-1)};
  if(edge==='east') return {x:rand(0,farX), y:rand(0,GH-1)};
  if(edge==='north') return {x:rand(0,GW-1), y:rand(Math.floor(GH*0.6),GH-1)};
  return {x:rand(0,GW-1), y:rand(0,farY)}; // south entry -> waves spawn near north
}
function spawnWave(){
  const tier=G.activeMission.tier;
  const pool=enemyPool(tier, G.battle.avgPartyTier);
  let count;
  if(G.battle.missionType==='relic'){
    G.battle.relicWaveNumber = (G.battle.relicWaveNumber||0) + 1;
    count = Math.max(2, 3 - (G.battle.relicWaveNumber-1));
  } else if(G.battle.missionType==='stalk'||G.battle.missionType==='packhunt'){
    count = Math.min(4, 2+Math.floor(G.battle.round/3));
  } else if(G.battle.missionType==='templerite'||G.battle.missionType==='elysiumhunt'||G.battle.missionType==='agoratoll'){
    count = Math.min(5, 3+Math.floor(G.battle.round/3));
  } else {
    count=Math.min(3, 1+Math.floor(G.battle.round/3));
  }
  for(let i=0;i<count;i++){
    let x,y,tries=0;
    do{ const p=oppositeEdgePoint(); x=p.x; y=p.y; tries++; }
    while((tileOccupied(x,y)||G.battle.obstacles.has(x+','+y)) && tries<30);
    if(tries>=30) continue;
    const t=choice(pool);
    const depthMult = tierDepthMult(tier);
    const e={id:uid(),name:t.name,glyph:t.glyph,side:'enemy',alive:true,
      hp:Math.round(t.hp*depthMult),maxhp:Math.round(t.hp*depthMult),atk:Math.round(t.atk*depthMult),def:t.def+tierDepthDefBonus(tier),init:t.init,move:t.move,range:t.range,x,y,
      tier:t.tier, baseType:t.name, abilityCooldowns:{}};
    applyMutations(e);
    assignEnemyLabel(e, G.battle.units);
    e.name = e.name+' '+e.label.slice(1);
    G.battle.units.push(e);
  }
  if(G.battle.missionType==='trial'){
    if(!G.battle.eliteWaveRounds){
      const eliteCount = G.activeMission.eliteCount||0;
      const allWaveRounds = [];
      for(let r=2;r<=G.battle.roundsRequired;r+=2) allWaveRounds.push(r);
      G.battle.eliteWaveRounds = new Set(allWaveRounds.slice(-eliteCount));
    }
    if(G.battle.eliteWaveRounds.has(G.battle.round)){
      let ex,ey,etries=0;
      do{ const p=oppositeEdgePoint(); ex=p.x; ey=p.y; etries++; }
      while((tileOccupied(ex,ey)||G.battle.obstacles.has(ex+','+ey)) && etries<30);
      if(etries<30){
        const elite = spawnEliteNear(ex, ey, tier, G.battle.avgPartyTier, tier>4);
        addBattleLog(`${elite.name} steps into the ring alongside the wave!`,'bad');
      }
    }
  }
}
function tileOccupied(x,y){ return G.battle.units.some(u=>u.alive&&u.x===x&&u.y===y); }
function tileFreeBattle(x,y){
  if(x<0||y<0||x>=GW||y>=GH) return false;
  if(G.battle.obstacles.has(x+','+y)) return false;
  if(tileOccupied(x,y)) return false;
  return true;
}
// Dijkstra pathfinding on the battle grid, 8-directional, respecting obstacles/units
// and difficult terrain (2x step cost). dijkstraSweep runs the search once from the
// unit's position and returns distances/predecessors to every reachable tile; callers
// needing a single destination's path should use findPath, which wraps this. Always
// sweep once and reuse the result rather than calling findPath per candidate tile.
function dijkstraSweep(unit, targetKey){
  const startKey = unit.x+','+unit.y;
  const dist = {[startKey]:0}, risk = {[startKey]:0}, prev = {};
  const visited = new Set();
  const frontier = [[0, 0, unit.x, unit.y]]; // [dist, risk, x, y]
  function dangerAt(x,y){
    return G.battle.units.some(f=>f.alive && f.side!==unit.side && Math.max(Math.abs(f.x-x),Math.abs(f.y-y))<=1) ? 1 : 0;
  }
  while(frontier.length){
    let bi=0;
    for(let i=1;i<frontier.length;i++){
      const a=frontier[i], b=frontier[bi];
      if(a[0]<b[0] || (a[0]===b[0] && a[1]<b[1])) bi=i;
    }
    const [d,r,cx,cy] = frontier.splice(bi,1)[0];
    const key = cx+','+cy;
    if(visited.has(key)) continue;
    visited.add(key);
    if(targetKey && key===targetKey) break;
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      if(dx===0&&dy===0) continue;
      const nx=cx+dx, ny=cy+dy, nKey=nx+','+ny;
      if(nx<0||ny<0||nx>=GW||ny>=GH || visited.has(nKey)) continue;
      // can path through any tile that's free, or the sweep's specific target itself
      if(!tileFreeBattle(nx,ny) && nKey!==targetKey) continue;
      const isDifficult = G.battle.difficultTerrain && G.battle.difficultTerrain.has(nKey);
      const nd = d + (isDifficult?2:1);
      const nRisk = r + dangerAt(nx,ny);
      const better = dist[nKey]===undefined || nd<dist[nKey] || (nd===dist[nKey] && nRisk<risk[nKey]);
      if(better){
        dist[nKey]=nd; risk[nKey]=nRisk; prev[nKey]=key;
        frontier.push([nd,nRisk,nx,ny]);
      }
    }
  }
  return {dist, prev, startKey};
}
function pathFromSweep(sweep, targetX, targetY){
  const targetKey = targetX+','+targetY;
  if(sweep.dist[targetKey]===undefined) return null;
  const path=[]; let k=targetKey;
  while(k!==sweep.startKey){ const [px,py]=k.split(',').map(Number); path.unshift({x:px,y:py}); k=sweep.prev[k]; }
  return {path, cost:sweep.dist[targetKey]};
}
function findPath(unit, targetX, targetY){
  const targetKey = targetX+','+targetY;
  if(unit.x===targetX && unit.y===targetY) return {path:[], cost:0};
  return pathFromSweep(dijkstraSweep(unit, targetKey), targetX, targetY);
}

async function processTurns(){
  while(true){
    updateDiscovery();
    checkBattleEnd();
    if(G.screen!=='battle'){ G.battle.animating=false; return; }
    if(G.battle.activeIndex>=G.battle.order.length){ startNewRound(); checkBattleEnd(); if(G.screen!=='battle'){ G.battle.animating=false; return; } }
    const unit=G.battle.order[G.battle.activeIndex];
    if(!unit.alive){ G.battle.activeIndex++; continue; }
    revertCasterDebuffs(unit.id);
    if(unit.side==='enemy'){
      G.battle.animating=true;
      await enemyAct(unit);
      revertTempMods(unit);
      G.battle.activeIndex++;
      checkBattleEnd();
      if(G.screen!=='battle'){ G.battle.animating=false; return; }
      continue;
    }
    G.battle.animating=false;
    G.battle.currentUnit=unit; G.battle.mode=null; G.battle.hasMoved=false; G.battle.hasAttacked=false;
    render();
    return;
  }
}

function applyTempMod(target, stat, amount, duration, casterId){
  target[stat] += amount;
  target.pendingRevert = target.pendingRevert || [];
  target.pendingRevert.push({type:'stat', stat, amount, callsRemaining: (duration||1)+1, casterId});
}
function applyTempFlag(target, flag, duration, value){
  target[flag] = value===undefined ? true : value;
  target.pendingRevert = target.pendingRevert || [];
  target.pendingRevert.push({type:'flag', stat:flag, callsRemaining: (duration||1)+1});
}
// Debuff that lasts until a SPECIFIC caster's next turn, rather than the affected
// unit's own next turn -- used by effects like Spore Contagion, where the debuff should
// still be live through the rest of this round and the target's own turn, only clearing
// once the original caster acts again.
function applyDebuffUntilCasterTurn(target, stat, amount, casterId){
  target[stat] += amount;
  target.pendingCasterRevert = target.pendingCasterRevert || [];
  target.pendingCasterRevert.push({stat, amount, casterId});
}
function revertCasterDebuffs(casterId){
  G.battle.units.forEach(u=>{
    if(!u.pendingCasterRevert || !u.pendingCasterRevert.length) return;
    const remaining = [];
    u.pendingCasterRevert.forEach(m=>{
      if(m.casterId===casterId){
        u[m.stat] -= m.amount;
      } else {
        remaining.push(m);
      }
    });
    u.pendingCasterRevert = remaining;
  });
}
// Stage 0 (rebalance plan): Knockback engine primitive. Pushes target up to
// `distance` tiles directly away from source, 8-directional (matches chebyshev
// movement elsewhere), stopping at the last tile that's actually free rather than
// failing outright -- "unless blocked" means a partial knockback is still a
// knockback, not a no-op. Reuses tileFreeBattle() (bounds + obstacles + unit
// occupancy) rather than re-deriving blocked-tile logic. Same-tile edge case
// (source/target overlapping) is a no-op, not an error, since it can't produce a
// meaningful direction.
function applyKnockback(source, target, distance){
  const dx = Math.sign(target.x - source.x), dy = Math.sign(target.y - source.y);
  if(dx===0 && dy===0) return {moved:0, blocked:true};
  let steps = 0, cx = target.x, cy = target.y;
  for(let i=0;i<distance;i++){
    const nx = cx+dx, ny = cy+dy;
    if(!tileFreeBattle(nx,ny)) break;
    cx = nx; cy = ny; steps++;
  }
  if(steps>0){
    target.x = cx; target.y = cy;
    addBattleLog(`${target.name} is knocked back ${steps} tile${steps>1?'s':''}!`, target.side==='player'?'bad':'good');
  }
  return {moved:steps, blocked: steps<distance};
}
// Stage 0 (rebalance plan): Leap engine primitive. Moves a unit directly to a
// destination tile, ignoring intervening units and non-wall terrain, but a
// wall-type (LoS-blocking) obstacle anywhere on the straight-line path invalidates
// the leap entirely -- reuses hasLineOfSight()'s existing Bresenham trace against
// G.battle.losBlockers rather than writing a second line-tracing implementation,
// since "can a solid obstacle be seen/crossed through" is the same question LoS
// already answers. The destination tile itself must be genuinely free (not just
// not-a-wall) since the unit lands and stands there.
function canLeapTo(unit, x, y){
  if(!tileFreeBattle(x,y)) return false;
  if(x===unit.x && y===unit.y) return false;
  return hasLineOfSight(unit.x, unit.y, x, y);
}
function resolveLeap(unit, x, y){
  if(!canLeapTo(unit, x, y)) return false;
  unit.x = x; unit.y = y;
  addBattleLog(`${unit.name} leaps into position!`, unit.side==='player'?'good':'bad');
  return true;
}
// Bug fix (v2.0.33): debuffs previously only reverted based on the AFFECTED unit's own
// turn count (pendingRevert/revertTempMods) or the CASTER's own next turn
// (pendingCasterRevert/revertCasterDebuffs) -- neither system ever cleared early if the
// caster died first, so a debuff from a caster who never gets another turn would sit
// active indefinitely. Confirmed root cause of a real reported bug: Elder's Wrath's
// DEF-to-0 debuff surviving all the way to the Company Hall screen post-battle, because
// the debuffed recruit didn't get enough further turns before the battle ended for the
// countdown to complete. Called at every death-finalization point (there are 5 in this
// file, only 2 of which shared code before this fix) so a caster's death always ends
// their outstanding debuffs immediately, on both systems.
function revertDebuffsFromDeadCaster(deadUnitId){
  G.battle.units.forEach(u=>{
    if(!u.pendingRevert || !u.pendingRevert.length) return;
    const remaining = [];
    u.pendingRevert.forEach(m=>{
      if(m.casterId===deadUnitId){
        if(m.type==='flag'){ u[m.stat] = false; } else { u[m.stat] -= m.amount; }
      } else {
        remaining.push(m);
      }
    });
    u.pendingRevert = remaining;
  });
  revertCasterDebuffs(deadUnitId);
}
// Determines whether a stat is currently net-buffed, net-debuffed, or unmodified, by
// summing every pending temp-mod entry for that stat across BOTH tracking systems
// (pendingRevert and pendingCasterRevert) -- a unit could have multiple stacked mods on
// the same stat (e.g. two separate debuffs), so this looks at the net direction rather
// than just whether any single entry exists. Used to color-code stat numbers in the
// battle status panel so a buff/debuff is visible at a glance, not just technically
// correct in the underlying number. Deliberately does NOT look at permanent effects
// (wounds, injuries) -- those are roster-level, not battle temp mods, and showing them
// as "debuffed" here would conflate two different systems.
function statModDirection(unit, stat){
  let net = 0;
  (unit.pendingRevert||[]).forEach(m=>{ if(m.type==='stat' && m.stat===stat) net += m.amount; });
  (unit.pendingCasterRevert||[]).forEach(m=>{ if(m.stat===stat) net += m.amount; });
  if(net>0) return 'buff';
  if(net<0) return 'debuff';
  return null;
}
function revertTempMods(unit){
  if(!unit.pendingRevert || !unit.pendingRevert.length) return;
  const stillPending = [];
  unit.pendingRevert.forEach(m=>{
    m.callsRemaining--;
    if(m.callsRemaining<=0){
      if(m.type==='flag'){ unit[m.stat] = false; } // this was the end of their FINAL covered turn — revert now
      else { unit[m.stat] -= m.amount; }
    } else {
      stillPending.push(m); // still has more of their own turns left to remain active for
    }
  });
  unit.pendingRevert = stillPending;
}

// Class abilities: every ability is now a REDUCED-DAMAGE ATTACK (at ABILITY_DAMAGE_PCT
// of normal) against an enemy in range, plus a secondary stat effect lasting until the
// START of the affected unit's own next turn (reverted by revertTempMods above).
// effectTarget decides who the secondary effect lands on:
//   'target' — the enemy being struck (Sunder, Disarming Strike, Leg Shot, Lethargy, Weaken, Hamstring, Cheap Shot)
//   'self'   — the caster (Defensive Stance, Steady Aim, Arcane Shield)
//   'ally'   — the lowest-`stat` eligible ally within allyRange of the caster, auto-selected;
//              if none are in range the ability still lands as a plain reduced attack (Selfless Bastion, Protective Ward)
// Gated behind Veteran Lv.2 (Lv.1 is already "spent" unlocking the class title itself).
const DEFAULT_ABILITY_DAMAGE_PCT = 0.75; // starting proposal — per-ability dmgPct overrides this after balance testing
const BUFF_ABILITIES = [
  // Rebalance Stage 3a: retagged/repriced under the current Tag Vocabulary and Allied
  // Cost Framework. All percentage-based (pctReduction/allyBuffPct/selfBuffPct) rather
  // than the old flat-amount/hard-zero schema. Guardian's abilities use a fixed numeric
  // range (1/2) rather than range:'weapon', since Guardian is pure canHeal now with no
  // weapon tie at all -- a canHeal recruit could be holding any of the 5 weapons, so
  // 'weapon' would silently vary Guardian's ability range by whatever they happened to
  // roll, breaking the Melee/Reach tier classification these prices are based on. Every
  // other class below remains weapon-tied (canCast/canHeal already checked first in
  // getClassName(), so e.g. every actual Vanguard-classed recruit deterministically
  // wields a Spear), so 'weapon' is still correct for them.
  {key:'selflessBastion', name:'Selfless Bastion', class:'Vanguard', range:'weapon', dmgPct:0.85,
   allyBuffTarget:'adjacentOnly', allyBuffStats:['def'], allyBuffPct:0.75, allyBuffDuration:1},
  {key:'dazingStrike',     name:'Dazing Strike',     class:'Vanguard', range:'weapon', dmgPct:0.70,
   stats:['atk','def'], pctReduction:0.75},
  {key:'defensiveStance',  name:'Defensive Stance',  class:'Duelist',  range:'weapon', dmgPct:0.85,
   selfBuffStats:['def'], selfBuffPct:0.75, selfBuffDuration:1},
  {key:'disarmingStrike',  name:'Disarming Strike',  class:'Duelist',  range:'weapon', dmgPct:0.70,

// Generic ability-description formatter (v2.0.31): builds a plain-English description
// from an ability's raw mechanical fields, rather than 40 hand-written strings across
// BOSS_ABILITY/ENEMY_ABILITIES/BUFF_ABILITIES/SPECIALIZATION_SKILLS -- self-maintaining,
// so a new or rebalanced ability gets an accurate tooltip automatically instead of a
// stale hand-written one. Style matches the game's existing formula-first tooltips (e.g.
// the Caster tag already states "Bolt power X = 3 + veteran level×2" rather than prose).
function describeAbility(ability){
  const parts = [];
  const statLabel = s => ({atk:'ATK',def:'DEF',init:'AGI',move:'Move'})[s] || s.toUpperCase();
  const statList = (list) => list.map(statLabel).join('/');

  if(ability.summon){
    parts.push(`Summons ${ability.summon.count} ${ability.summon.type}${ability.summon.count>1?'s':''} adjacent to the caster.`);
  } else {
    // Damage clause
    if(ability.dmgMult!==undefined) parts.push(`Deals ${ability.dmgMult===1.0?'normal':Math.round(ability.dmgMult*100)+'%'} damage${ability.dmgMult>1?' (bonus)':ability.dmgMult<1?' (reduced)':''}.`);
    else if(ability.dmgPct!==undefined) parts.push(`Deals ${Math.round(ability.dmgPct*100)}% damage instead of a normal attack.`);
    // Area/multi-target clause
    if(ability.aoe==='surrounding') parts.push('Also hits anyone adjacent to the target.');
    else if(ability.aoe==='nearest1') parts.push(`Splashes to the nearest additional target for ${Math.round((ability.splashDmgMult||0.5)*100)}% damage.`);
    if(ability.dualTarget) parts.push('Strikes two separate targets.');
    if(ability.repeatHit) parts.push('Strikes the same target twice.');
    if(ability.executeThreshold!==undefined) parts.push(`Deals ${ability.executeMult}x damage if the target is below ${Math.round(ability.executeThreshold*100)}% HP, otherwise ${ability.normalMult}x.`);
    if(ability.lifesteal) parts.push(`Heals the caster for ${Math.round(ability.lifesteal*100)}% of the damage dealt.`);
    if(ability.fullHpOnly) parts.push('Only usable against a target still at full HP.');
    // Debuff clause (stat/stats + setToZero or pctReduction)
    const dstats = ability.stats || (ability.stat ? [ability.stat] : []);
    if(dstats.length && ability.effectTarget!=='self' && ability.effectTarget!=='ally' && !ability.allyBuffStat){
      const bossNote = ability.bossSafeStats ? ` (only ${statList(ability.bossSafeStats)} against bosses)` : '';
      if(ability.setToZero) parts.push(`Sets the target's ${statList(dstats)} to 0 temporarily${bossNote}.`);
      else if(ability.pctReduction) parts.push(`Cuts the target's ${statList(dstats)} by ${Math.round(ability.pctReduction*100)}% temporarily${bossNote}.`);
    }
    // Self/ally buff clause
    if(ability.effectTarget==='self' && dstats.length && ability.amount) parts.push(`+${ability.amount} ${statList(dstats)} to the caster, temporarily.`);
    if(ability.effectTarget==='ally' && dstats.length && ability.amount) parts.push(`+${ability.amount} ${statList(dstats)} to an ally within ${ability.allyRange||1} tile${(ability.allyRange||1)>1?'s':''}, temporarily${ability.requireWounded?' (target must be wounded)':''}.`);
    if(ability.allyBuffStat || ability.allyBuffStats) parts.push(`+${Math.round(ability.allyBuffPct*100)}% ${statList(ability.allyBuffStats||[ability.allyBuffStat])} to ${ability.allyBuffTarget==='selfAndAdjacent'?'the caster and adjacent allies':ability.allyBuffTarget==='adjacentOnly'?'adjacent allies':'allies'} for ${ability.allyBuffDuration} turn${ability.allyBuffDuration>1?'s':''}.`);
    if(ability.selfBuffStats) parts.push(`+${Math.round(ability.selfBuffPct*100)}% ${statList(ability.selfBuffStats)} to the caster${ability.selfHealAmount?`, +${ability.selfHealAmount} HP`:''}, for ${ability.selfBuffDuration} turn${ability.selfBuffDuration>1?'s':''}.`);
    if(ability.knockback) parts.push(`Knocks the target back ${ability.knockback} tile${ability.knockback>1?'s':''}, unless blocked.`);
    if(ability.leap) parts.push(`Leaps up to ${ability.leap} tiles to reach the target, ignoring units and low terrain (not walls).`);
    if(ability.statPct && ability.autoTarget) parts.push(`${ability.reflect?`Reflects ${Math.round(ability.reflect*100)}% of incoming melee damage and `:''}+${Math.round(ability.statPct*100)}% ${statLabel(ability.stat)} to ${ability.autoTarget==='allAllies'?'the whole squad':'allies'} for ${ability.duration} turn${ability.duration>1?'s':''}.`);
    if(ability.healAmount) parts.push(`Heals the whole squad ${ability.healAmount} HP${ability.enemyDamage?` and deals ${ability.enemyDamage} to all nearby enemies`:''}.`);
    if(ability.riposteDuration) parts.push(`The caster automatically strikes back at the next melee attack against them, for ${ability.riposteDuration} turn${ability.riposteDuration>1?'s':''}.`);
    if(ability.passive){
      const passiveText = {
        darknessOnWin: `Passive -- reduces Darkness by ${ability.darknessReduction} on a mission win.`,
        bonusGoldOnWin: `Passive -- +${Math.round(ability.goldPct*100)}% gold on a mission win.`,
        bonusHpOnWin: 'Passive -- +1 max HP on a mission win.',
        guaranteedDropOnEliteKill: 'Passive -- guarantees an item drop on an elite/boss kill.'
      };
      parts.push(passiveText[ability.passiveEffect] || 'Passive effect.');
    }
  }
  if(!ability.passive && ability.cooldown!==undefined) parts.push(`Cooldown: ${ability.cooldown===0?'none':ability.cooldown+' rounds'}.`);
  return parts.join(' ');
}
// Combined name->ability lookup across all 4 ability tables, for matching the combat
