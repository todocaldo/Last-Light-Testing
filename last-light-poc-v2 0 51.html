// How to Play (v2.0.18). Scoped deliberately to what item 1 actually asked for -- header
// stats, recruiting, squad selection, mission choice. Battle Basics is left as an
// explicit placeholder rather than guessed-at content, since terrain reminders and
// battle-mechanics explanation are separate, still-open items (4 and 5) with their own
// design discussion pending. Extend this section once those are locked, don't backfill
// it speculatively now.
function renderHelp(){
  const el=document.getElementById('screenHelp');
  el.innerHTML = `
    <div class="card">
      <h2>How to Play</h2>
      <button onclick="closeHelp()">← Back</button>

      <h3 style="margin-top:16px">Header Stats</h3>
      <p><b>Gold</b> — your treasury. Spent hiring recruits, paying daily upkeep, paying the tithe, and expanding the Barracks.</p>
      <p><b>Upkeep</b> — a daily cost for every recruit in your active roster: <code>2 + (tier×3) + (veteran level×2)</code> gold each, scaled by your patron's upkeep modifier. Charged automatically every mission attempt, win or lose.</p>
      <p><b>Tithe</b> — a recurring payment due every 3 missions to keep the Beacon fed. Miss it, and the Darkness meter surges hard instead of creeping.</p>
      <p><b>Darkness</b> — rises with every mission attempt regardless of outcome. Paying the tithe on time pushes it back. If it ever fills completely, the campaign ends.</p>
      <p><b>Day / Expedition</b> — advances with every mission attempt (or by using "Advance Day" to pay retainers without embarking).</p>

      <h3 style="margin-top:16px">Recruiting</h3>
      <p>The Recruitment Office shows a pool of candidates you can hire for a one-time gold cost. The pool refreshes for a fee that scales with your standing (reputation tier) — higher standing draws a larger, better pool, but costs more to refresh.</p>
      <p>Your active roster has a capacity (shown as Barracks X/Y in Company Hall). Once full, you can't hire further until you expand it or free up a slot.</p>

      <h3 style="margin-top:16px">Squad Selection</h3>
      <p>From Company Hall, select up to 3 recruits for your next expedition. Recruits who survive missions gain experience toward veteran levels, unlocking stronger stats and eventually a specialization choice.</p>
      <p>Recruits who fight enough missions together form a Bond, giving both a small stat bonus whenever they're deployed together again.</p>

      <h3 style="margin-top:16px">Healing, Wounds &amp; Injuries</h3>
      <p><b>Wounds</b> — if a recruit survives a mission at 25% max HP or below, they come back Wounded: two random stats (ATK, DEF, AGI, or Move) each drop by 1, stacking with any prior wounds. Wounds aren't permanent — a recruit who sits out an expedition recovers 25% of their max HP (35% under a Temple patron) and has one wound mended, each cycle they're benched. A deep enough roster to rotate wounded recruits out is the main way to manage this.</p>
      <p><b>Injuries</b> — if a recruit would otherwise die, there's a 30% chance they survive instead with a permanent injury: a flavored, specific -2 to one random stat (a Mangled Hand, a Punctured Eye, and so on) that never heals on its own, unlike a wound. It's the cost of being pulled back from the brink.</p>

      <h3 style="margin-top:16px">Choosing a Mission</h3>
      <p>The Expedition Board lists available missions, each with a type, tier, and reward. Higher-tier missions pay more but are harder. Some regions offer a connected chain of missions working toward reclaiming that territory for good.</p>
      <p><b>Defense</b> — hold out for a set number of rounds against wave after wave, then clear whoever's left standing.</p>
      <p><b>Explore</b> — reach and claim 2 marked sites by walking onto them (instant, no fighting required to claim). Enemies keep arriving throughout, so it's a race against pressure more than a fight to the last enemy.</p>
      <p><b>Bosshunt</b> — kill everything, including the boss. No separate objective — the boss is just the toughest thing standing between you and a clear field.</p>
      <p><b>Purge</b> — stand on the corruption site for 2 consecutive rounds to suppress it (this also stops further waves from spawning), then clear whatever's still on the field.</p>
      <p><b>Relic</b> — claim the relic by reaching its tile, then get your <i>whole surviving squad</i> back to the entrance edge to extract. Leaving someone behind means the mission isn't over yet.</p>
      <p><b>Stalk</b> — find a hidden elite by reaching a clue tile (this triggers it to spawn, and waves only start once it's found), then defeat it along with everything else still on the field.</p>

      <h3 style="margin-top:16px">Battle Basics</h3>
      <p><b>Deployment</b> — before the fight begins, place your squad within the highlighted spawn zone. Tap a recruit to select them, then tap an open tile in the zone to place them there. Tap an already-placed recruit's tile to pick them back up and move them elsewhere before you're ready.</p>
      <p><b>Combat Stats</b> — a landed hit deals <code>ATK − effective DEF + a small random swing (-1 to +2)</code>, minimum 1 damage. Effective DEF includes a +1 bonus if the defender is on High Ground.</p>
      <p><b>Block</b> — if the defender's effective DEF is at least equal to the attacker's ATK, there's a chance they block the hit completely instead of taking reduced damage. The chance scales with how much greater DEF is than ATK: <b>20%</b> if DEF is less than 50% higher, <b>40%</b> if it's 50-99% higher, and <b>60%</b> (the cap) once DEF is double the attacker's ATK or more.</p>
      <p><b>Dodge</b> — every attack first rolls a dodge chance based on the defender's AGI — <code>min(30%, AGI × 2%)</code> — and a successful dodge negates the attack entirely, no damage at all.</p>
      <p><b>Move &amp; Attack</b> — each unit gets one move and one action (attack, or Heal/Cast Bolt if they have it) per turn, in either order — move then act, act then move, or just one of the two. Tap Move or Attack to enter that mode, then tap a highlighted tile to carry it out.</p>
      <p><b>Casting &amp; Healing</b> — a Healer can spend their action to heal instead of attack, restoring 2-4 HP to themselves or an ally within 2 tiles (only works on someone below max HP). A Caster can channel a ranged, armor-piercing bolt instead of a normal attack — power is <code>3 + (veteran level × 2)</code>, so it grows as they level up, and damage is <code>power − half the target's DEF (rounded down) + a small random swing</code>, minimum 1. Armor-piercing means it ignores half the target's effective defense, and unlike a normal attack, a Cast Bolt can't be dodged.</p>
      <p><b>Opportunity Attacks</b> — if a unit moves away from an enemy it started next to (disengaging from melee range), that enemy gets a free strike as it leaves. This works both ways — it applies just as much to enemies retreating from your units as it does to your recruits pulling back from theirs. Simply walking up to an enemy, or moving while staying adjacent to one, doesn't trigger it — only breaking away from a tile you were already next to does.</p>
      <p><b>Light Levels</b> — your squad is the light source. <b>Lit</b> tiles (close to a recruit) can be attacked by anyone. <b>Dim</b> tiles (further out, a wider ring) are fine for melee, but a ranged attacker normally can't target anything there — <b>Duskhunters are the exception</b>: their reclass training lets them make ranged attacks into dim light like it's fully lit. <b>Fog</b> is anything never yet revealed — it could be hiding an enemy you haven't discovered. Once a tile's been lit at all, its terrain stays visible on the map even after your squad moves on (though any enemy standing there again vanishes from view if the light leaves) — only whether something's currently *targetable* depends on the light tier right now.</p>
      <p><b>Terrain</b></p>
      <p><b>~ Difficult Terrain</b> — costs an extra step of movement to enter (2 steps total instead of 1). Doesn't block movement outright, just makes it more expensive to cross.</p>
      <p><b>Obstacles</b> — impassable; every kind blocks movement, but only some also block line of sight for ranged attacks and Line-of-Sight-dependent abilities. Exact appearance varies a little by region, but they fall into two groups: <b>Rubble</b> (▓ or ▒) — blocks movement only, you can still see and shoot over/around it. <b>Walls, Rock, and Gnarled Trees</b> (█, ▲, ♠) — block both movement and line of sight, so they can hide what's on the other side.</p>
      <p><b>^ High Ground</b> — grants +1 DEF to whoever's standing on it. Worth holding, not just crossing.</p>
      <p><b>✦ Objective</b> — the mission's goal marker; what it takes to claim it depends on the mission type.</p>
      <p class="hint">The Battle Key strip below the grid during a fight has a quick-reference version of all of this, plus the same for light tiers.</p>

      <button onclick="closeHelp()" style="margin-top:10px">← Back</button>
    </div>`;
}
function renderHallOfFame(){
  const el=document.getElementById('screenHallOfFame');
  const everyone = allEverRostered();
  const statusLabel = {active:'active', retired:'retired', fell:'fell in battle'};
  const statusColor = {active:'var(--good)', retired:'var(--ember)', fell:'var(--blood)'};
  const categoriesHtml = HALL_OF_FAME_CATEGORIES.map(cat=>{
    const ranked = everyone.filter(r=>(r[cat.key]||0)>0).sort((a,b)=>(b[cat.key]||0)-(a[cat.key]||0)).slice(0,5);
    const rows = ranked.length ? ranked.map((r,i)=>`
      <div style="display:flex;justify-content:space-between;padding:3px 0;${i<ranked.length-1?'border-bottom:1px solid var(--line)':''}">

        <b>${r[cat.key]}</b>
      </div>`).join('') : `<small class="hint">No one's claimed this yet.</small>`;
    return `
    <div class="card" style="margin-top:10px">
      <h3 style="margin:0 0 6px 0;font-size:12px;color:var(--ember)">${cat.label}</h3>
      ${rows}
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="card">
      <h2>🏆 Hall of Fame</h2>
      <small class="hint">Every recruit who's ever served — active, retired, or fallen. Top 5 in each category.</small>
      <button onclick="closeHallOfFame()" style="margin-top:10px">← Back</button>
    </div>
    ${everyone.length ? categoriesHtml : '<div class="card"><small class="hint">No one\'s taken the field yet. Their story starts with your first expedition.</small></div>'}
    <button onclick="closeHallOfFame()" style="margin-top:10px">← Back</button>`;
}

function gotoPatronPage(page){
  G.patronPage = page;
  render();
}
function renderNavShell(activePage){
  const pages = [['hall','Company Hall'],['recruitment','Recruitment Office'],['board','Expedition Board'],['territories','Reclaimed Territories']];
  const regionLabels = {temple:'The Temple', elysium:'Elysium', agora:'Agora', arena:'The Arena'};
  const isRegionPage = !!regionLabels[activePage];
  const currentLabel = isRegionPage ? regionLabels[activePage] : (pages.find(p=>p[0]===activePage)||[,'Company Hall'])[1];
  const chronicleStrip = `
    <div class="card" style="margin-bottom:10px">
      <h2 style="cursor:pointer;margin:0;border:none" onclick="toggleChronicle()">Chronicle <small class="hint" style="margin:0;display:inline">${G.chronicleExpanded?'(click to collapse)':'(click to expand — '+G.log.length+' entries)'}</small></h2>
      ${G.chronicleExpanded
        ? `<div class="log" style="margin-top:8px">${G.log.slice().reverse().map(l=>`<div class="${l.cls}">${l.msg}</div>`).join('')}</div>`
        : (G.log.length ? `<div class="${G.log[G.log.length-1].cls}" style="margin-top:6px;font-size:11px">${G.log[G.log.length-1].msg}</div>` : '<small class="hint">Nothing has happened yet.</small>')}
    </div>`;
  return `
    ${chronicleStrip}
    <div class="navstrip">
      <div class="breadcrumb">Camp ${isRegionPage?`<span class="sep">/</span> Reclaimed Territories <span class="sep">/</span> <span class="current">${currentLabel}</span>`:`<span class="sep">/</span> <span class="current">${currentLabel}</span>`}</div>
      <div class="navpills">
        ${pages.map(([key,label])=>`<button class="navpill ${activePage===key?'active':''}" ${activePage===key?'':`onclick="gotoPatronPage('${key}')"`}>${label}</button>`).join('')}
      </div>
    </div>`;
}
function renderPatron(){
  const el=document.getElementById('screenPatron');
  if(!G.patronPage) G.patronPage = 'hall';
  const page = G.patronPage;
  const regionPages = {temple:1, elysium:1, agora:1, arena:1};
  if(regionPages[page] && !G.hasWon){ G.patronPage='hall'; return renderPatron(); } // guard against a stale deep link before the capstone is won
  el.innerHTML = renderNavShell(page) + (
    page==='hall' ? renderCompanyHallPage() :
    page==='recruitment' ? renderRecruitmentOfficePage() :
    page==='board' ? renderExpeditionBoardPage() :
    page==='territories' ? renderTerritoriesPage() :
    renderRegionPage(page)
  );
}
function buildCapstoneHtml(){
  const cs = capstoneReady();
  const flavor = CAPSTONE_FLAVOR[G.patron.key];
  const hasRealProgress = cs.repReady || cs.squadReady || G.rep >= CAPSTONE_REP_THRESHOLD*0.5 || cs.veteranCount >= 1;
  // Bug fix (v2.0.40): the capstone was repeatably attemptable for its full 600g/50rep
  // reward even after being won -- G.hasWon gets set on victory (endBattle) but was only
  // ever CHECKED to unlock the post-capstone region-reclaim layer, never to gate the
  // capstone mission itself back out. Show a conquered state instead of the attempt
  // button once G.hasWon is true.
  if(G.hasWon) return `
    <div class="card victoryscreen" style="text-align:left;padding:16px">
      <h2 style="color:var(--ember)">${flavor.glyph} ${flavor.name}</h2>
      <p><b style="color:var(--ember)">THE LIGHT HOLDS</b></p>
      <p class="hint">${flavor.bossName} has already fallen to your company. The trial does not come twice.</p>
    </div>`;
  return cs.ready ? `
    <div class="card victoryscreen" style="text-align:left;padding:16px">
      <h2 style="color:var(--ember)">${flavor.glyph} ${flavor.name}</h2>
      <p><small class="hint">${flavor.desc}</small></p>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <span class="tag">Reward: 600g / 50 rep</span>
        ${embarkButtonHtml(`embarkCapstone()`, `Face ${flavor.bossName}`)}
      </div>
    </div>` : hasRealProgress ? `
    <div class="card">
      <h2>The Final Trial</h2>
      <small class="hint">${flavor.name} awaits once your company is ready to face it.</small>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <span class="tag" style="${cs.repReady?'color:var(--good);border-color:var(--good)':''}">${cs.repReady?'✓':'○'} Reputation ${G.rep}/${CAPSTONE_REP_THRESHOLD}</span>
        <span class="tag" style="${cs.squadReady?'color:var(--good);border-color:var(--good)':''}">${cs.squadReady?'✓':'○'} Recruits who reached max level: ${cs.veteranCount}/${CAPSTONE_VETERANS_REQUIRED}</span>
      </div>
    </div>` : `
    <div class="hint" style="padding:4px 2px">🏔 ${flavor.name} awaits, once your company has grown enough to face it.</div>`;
}

    if((G.arenaChainStep||0) >= ARENA_CHAIN.length){
      return `

      <h2 style="color:var(--ember)">🗡 The Endless Bout</h2>

        <span class="tag">Reward: 400g / 40 rep</span>

function territoryStatus(reclaimedFlag, chainStep, chainLength, unlockReadyFn){
  if(reclaimedFlag) return 'reclaimed';
  if((chainStep||0) >= chainLength) return 'bossready';

  return 'active';
}

function renderDeploy(){
  const el=document.getElementById('screenDeploy');
  const d=G.deploy;
  // Playtest fix: Deploy previously showed players by bare weapon glyph only (same gap
  // battle had before v2.0.13's fix) -- two Longbow users were indistinguishable even
  // before the fight started. Recomputed fresh each render (idempotent, cheap, squad
  // composition doesn't change mid-deployment) rather than persisted, since deploy has
  // no equivalent of battle's single beginBattle() entry point to compute it once.
  const squadUnitsForLabel = d.squadIds.map(id=>G.roster.find(r=>r.id===id)).filter(Boolean);
  squadUnitsForLabel.forEach(u=>{ u.label=null; });
  squadUnitsForLabel.forEach(u=>assignPlayerLabel(u, squadUnitsForLabel));
  let cells='';
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    let cls='cell', ch='.';
    const key=x+','+y;
    let title='';
    const isDiscovered = !d.discoveredTiles || d.discoveredTiles.has(key);
    const isLit = !d.litTiles || d.litTiles.has(key);
    const isFullyLit = !d.fullyLitTiles || d.fullyLitTiles.has(key);
    if(isDiscovered && d.spawnZone.tiles.has(key)) cls+=' dz dzclick';
    if(!isDiscovered){
      cls+=' fog';
      ch='';
    } else {
      if(!isLit) cls+=' dimmed';
      else if(!isFullyLit) cls+=' greylit';
      else cls+=' lit';
      if(d.obstacles.has(key)){ cls+=' obstacle'; ch=(d.obstacleGlyphs&&d.obstacleGlyphs.get(key))||'▓'; title=(d.losBlockers&&d.losBlockers.has(key))?'Blocks movement and line of sight':'Blocks movement only'; }
      else if(d.highGround && d.highGround.has(key)){ cls+=' highground'; ch='^'; }
      else if(d.difficultTerrain && d.difficultTerrain.has(key)){ cls+=' difficult'; ch='~'; }
      if(isLit){
        const enemyHere=d.enemies.find(e=>e.x===x&&e.y===y);
        if(enemyHere){ cls+=' enemyunit'+(enemyHere.isBoss?' boss':''); ch=enemyHere.label||enemyHere.glyph; }
      }
      const placedEntry=Object.entries(d.placed).find(([k,v])=>v.x===x&&v.y===y);
      if(placedEntry){ cls+=' playerunit'; const u=G.roster.find(r=>r.id===Number(placedEntry[0])); ch=u.label||WEAPONS[u.weaponKey].glyph;
        if(d.selecting===Number(placedEntry[0])) cls+=' active'; }
      if(d.objectives && isLit && d.objectives.some(o=>o.x===x&&o.y===y)){ cls+=' objective'; ch='✦'; }
    }
    if(isDiscovered && d.spawnZone.tiles.has(key)) cls+=' dzclick';
    if(ch.length>1) cls+=' wide';
    cells+=`<div class="${cls}" onclick="deployCellClick(${x},${y})">${ch}</div>`;
  }
  const squadRows = d.squadIds.map(id=>{
    const u=G.roster.find(r=>r.id===id);
    const placed=d.placed[id];
    const tags = `${getClassName(u)?`<span class="tag" style="color:var(--ember);border-color:var(--ember-dim)">${getFullClassName(u)} Lv${u.veteranLevel}</span>`:''}${u.canHeal?'<span class="tag" style="color:var(--good);border-color:var(--good)">✚ Healer</span>':''}${u.canCast?'<span class="tag" style="color:var(--corrupt);border-color:var(--corrupt)">✦ Caster</span>':''}`;
    return `<div class="statusrow me${d.selecting===id?' active':''}" onclick="pickSquadForPlacement(${id})">
      <div class="statusname">${WEAPONS[u.weaponKey].glyph} ${u.name} <small class="hint" style="margin:0">— ${WEAPONS[u.weaponKey].label}</small> ${tags}</div>
      <div class="barouter"><div class="barinner" style="width:${100*u.hp/u.maxhp}%;background:${hpBarColor(u.hp,u.maxhp)}"></div></div>
      <div class="statushp">${u.hp}/${u.maxhp} · ${placed?'Placed ✓':'Click, then click a highlighted tile'}</div>
    </div>`;
  }).join('');
  const allPlaced = Object.keys(d.placed).length===d.squadIds.length;
  el.innerHTML=`
    <div class="battlelayout">
      <div class="card battlegrid-card">
        <h2>Deployment — ${G.activeMission.name} <span class="tag">${MISSION_SETTINGS[G.activeMission.setting].name}</span></h2>
        <small class="hint" style="margin:0">${MISSION_SETTINGS[G.activeMission.setting].flavor}</small>
        <small class="hint">${G.activeMission.desc} Click a squad member below, then click a highlighted tile on the left to place them.</small>
        <div class="gridwrap" style="margin-top:8px"><div class="grid" style="grid-template-columns:repeat(${GW},var(--cell-size))">${cells}</div></div>
        ${d.tileInfoMsg ? `<small class="hint" style="color:var(--ember)">▓ ${d.tileInfoMsg}</small>` : ''}
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="primary" onclick="beginBattle()" ${allPlaced?'':'disabled'}>⚔ Begin Battle</button>
          <button class="danger" onclick="cancelExpedition()">${G.deploy.confirmCancel?'Confirm? (counts as a failure)':'Cancel Expedition'}</button>
        </div>
      </div>
      <div class="deployinfo-row">
        <div class="card">
          <h2>Your Squad</h2>
          <div class="statuslist">${squadRows}</div>
        </div>
        <div class="card">
          <h2>Enemies Sighted</h2>
          <div class="statuslist">${d.enemies.map(e=>{
            const mutInfo = mutationsTooltip(e);
            const nameTag = mutInfo ? tappableTag(`scout-${e.id}`, `${e.label} ${e.name}${e.isBoss?' ☠':''}`, mutInfo, e.isBoss?'color:var(--blood);border-color:var(--blood)':'', 'max-height:180px') : null;
            return `<div class="statusrow en" style="display:flex;align-items:flex-start">
            ${portraitBox(e.isBoss?'boss':e.baseType, e.isBoss?'☠':((e.baseType||'?')[0]), 'portrait-sm')}
            <div style="flex:1;min-width:0">
              <div class="statusname">${nameTag ? nameTag.tagHtml : `${e.label} ${e.name}${e.isBoss?' <span class="tag" style="color:var(--blood);border-color:var(--blood)">☠</span>':''}`}</div>
              <div class="statushp">HP ${e.maxhp} · ATK ${e.atk} · DEF ${e.def}</div>
              ${nameTag ? nameTag.panelHtml : ''}
            </div>
          </div>`;}).join('')}</div>
          <small class="hint">Map glyph shows each recruit's weapon. Enemy labels (e.g. h1, h2) match the names above — scout them before you commit to a fight.</small>
        </div>
      </div>
    </div>`;
}

function renderBattle(){
  const el=document.getElementById('screenBattle');
  const b=G.battle, u=b.currentUnit;
  const moveSet = u ? validMoveTiles(u) : [];
  const atkSet = u ? validAttackTargets(u) : [];
  const healSet = (u && u.canHeal) ? validHealTargets(u) : [];
  const castSet = (u && u.canCast) ? validCastTargets(u) : [];
  const activeAbility = u ? BUFF_ABILITIES.find(a=>a.key===b.mode) : null;
  const abilitySet = (u && activeAbility) ? validAbilityTargets(u, activeAbility) : [];
  let cells='';
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    let cls='cell', ch='.';
    const key=x+','+y;
    let title='';
    const isDiscovered = !b.discoveredTiles || b.discoveredTiles.has(key);
    const isLit = !b.litTiles || b.litTiles.has(key);
    const isFullyLit = !b.fullyLitTiles || b.fullyLitTiles.has(key);
    if(isDiscovered && b.spawnZone && b.spawnZone.tiles.has(key)) cls+=' spawnzone';
    if(!isDiscovered){
      cls+=' fog';
      ch='';
    } else {
      if(!isLit) cls+=' dimmed';
      else if(!isFullyLit) cls+=' greylit';
      else cls+=' lit';
      if(b.obstacles.has(key)){ cls+=' obstacle'; ch=(b.obstacleGlyphs&&b.obstacleGlyphs.get(key))||'▓'; title=(b.losBlockers&&b.losBlockers.has(key))?'Blocks movement and line of sight':'Blocks movement only'; }
      else if(b.highGround && b.highGround.has(key)){ cls+=' highground'; ch='^'; }
      else if(b.difficultTerrain && b.difficultTerrain.has(key)){ cls+=' difficult'; ch='~'; }
      const objHere = b.objectives && b.objectives.find(o=>o.x===x&&o.y===y);
      if(objHere && !objHere.claimed){ cls+=' objective'; ch='✦'; }
      if(isLit){
        const unitHere=b.units.find(uu=>uu.alive&&uu.x===x&&uu.y===y);
        if(unitHere){
          cls += unitHere.side==='player' ? ' playerunit' : ' enemyunit'+(unitHere.isBoss?' boss':'');
          ch = unitHere.label || (unitHere.side==='player' ? WEAPONS[unitHere.weaponKey].glyph : unitHere.glyph);
          // Playtest fix (v2.0.13, extended in v2.0.16 to enemies too): border color as
          // an at-a-glance HP indicator, since there's no room for a bar in a 24-36px
          // cell. For players, the red threshold deliberately matches WOUND_HP_THRESHOLD
          // (0.25) exactly -- "this recruit will be Wounded if the mission ends right
          // now." Enemies have no equivalent mechanic at that exact number (they just
          // die), so for them it's purely a visual HP-tier signal reusing the same
          // thresholds for consistency, not a mechanic tie-in. Enemy tiers use darker
          // shades of the same 3 colors (hp-enemy-* classes) so the two readings stay
          // visually distinct at a glance -- ally-hurt should not look identical to
          // enemy-hurt.
          const hpPct = unitHere.hp / unitHere.maxhp;
          const hpTier = hpPct <= WOUND_HP_THRESHOLD ? 'critical' : hpPct <= 0.5 ? 'caution' : 'healthy';
          cls += unitHere.side==='player' ? ` hp-${hpTier}` : ` hp-enemy-${hpTier}`;
          if(u && unitHere.id===u.id) cls+=' active';
        }
      }
    }
    if(isDiscovered){
      if(b.mode==='move' && moveSet.includes(key)) cls+=' mv';
      if(b.mode==='attack' && atkSet.includes(key)) cls+=' atk';
      if(b.mode==='heal' && healSet.includes(key)) cls+=' heal';
      if(b.mode==='cast' && castSet.includes(key)) cls+=' cast';
      if(activeAbility && abilitySet.includes(key)) cls+= activeAbility.amount>0 ? ' heal' : ' cast';
    }
    if(ch.length>1) cls+=' wide';
    cells+=`<div class="${cls}" onclick="battleCellClick(${x},${y})">${ch}</div>`;
  }
  const initStrip = b.order.map((uu,i)=>{
    let c = uu.side==='player' ? 'itoken me' : 'itoken en';
    if(i===b.activeIndex) c+=' act';
    const label = uu.side==='player' ? uu.name.split(' ')[0] : uu.name; // enemy names already embed "BaseType N" (e.g. "Husk 1") -- taking just the first word was silently dropping the number, making duplicate enemy types indistinguishable in the tracker
    return `<div class="${c}">${label}</div>`;
  }).join('');

  let unitPanel = '<small class="hint">Resolving enemy actions…</small>';
  if(u){
    unitPanel = `
      <div class="unitpanel">
        <b>${u.name}</b> ${u.side==='player'?'· '+(getClassName(u)?getFullClassName(u)+' ('+WEAPONS[u.weaponKey].label+')':WEAPONS[u.weaponKey].label):''} ${u.canHeal?'<span class="tag" style="color:var(--good);border-color:var(--good)">✚ Healer</span>':''}${u.canCast?'<span class="tag" style="color:var(--corrupt);border-color:var(--corrupt)">✦ Caster</span>':''}<br>
        <div class="barouter"><div class="barinner" style="width:${100*u.hp/u.maxhp}%;background:${hpBarColor(u.hp,u.maxhp)}"></div></div>
        HP ${u.hp}/${u.maxhp} · ATK ${u.atk} · DEF ${u.def} · Move ${u.move} · Range ${u.range}
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <button class="${b.mode==='move'?'primary':''}" onclick="setMode('move')" ${b.hasMoved?'disabled':''}>${b.hasMoved?'Moved ✓':'Move'}</button>
          <button class="${b.mode==='attack'?'primary':''}" onclick="setMode('attack')" ${b.hasAttacked||atkSet.length===0?'disabled':''}>${b.hasAttacked?'Attacked ✓':'Attack'}</button>
          ${u.canHeal ? (()=>{ const info=tappableTag(`u${u.id}-healinfo`,'ⓘ','Restores 2-4 HP to an ally (random, flat -- does not scale with level).'); return `<button class="${b.mode==='heal'?'primary':''}" onclick="setMode('heal')" ${b.hasAttacked||healSet.length===0?'disabled':''}>${b.hasAttacked?'Acted ✓':'Heal (2-4 HP)'}</button>${info.tagHtml}`; })() : ''}
          ${u.canCast ? (()=>{ const info=tappableTag(`u${u.id}-castinfo`,'ⓘ',`Bolt power ${3+(u.veteranLevel||0)*2} (3 + veteran level x2). Damage = power minus half the target's DEF, plus/minus 1-2 variance, minimum 1. Ignores half the target's armor and doesn't use your weapon or ATK stat.`); return `<button class="${b.mode==='cast'?'primary':''}" onclick="setMode('cast')" ${b.hasAttacked||castSet.length===0?'disabled':''}>${b.hasAttacked?'Acted ✓':'Cast Bolt (armor-pierce)'}</button>${info.tagHtml}`; })() : ''}
          ${unitAbilities(u).map(a=>{
            const pct = Math.round((a.dmgPct!==undefined?a.dmgPct:DEFAULT_ABILITY_DAMAGE_PCT)*100);
            const statsForLabel = a.stats || [a.stat];
            const statLabel = statsForLabel.map(s=>statAbbrev(s)).join('&');
            const effectLabel = a.setToZero ? `${statLabel}→0` : `${a.amount>0?'+':''}${a.amount} ${statLabel}`;
            const label = `${a.name} (${pct}% dmg, ${effectLabel})`;
            const targets = validAbilityTargets(u,a);
            return `<button class="${b.mode===a.key?'primary':''}" onclick="setMode('${a.key}')" ${b.hasAttacked||targets.length===0?'disabled':''}>${b.hasAttacked?'Acted ✓':label}</button>`;
          }).join('')}
          ${(function(){
            const info = unitSpecializationSkillInfo(u);
            if(!info) return '';
            const skill = info.skill;
            if(info.onCooldown){
              return `<button disabled>${skill.name} (cooldown: ${info.roundsLeft})</button>`;
            }
            const label = `${skill.name} (${describeSkill(skill)})`;
            if(skill.instant){
              return `<button onclick="useSkillInstant('${skill.key}')" ${b.hasAttacked?'disabled':''}>${b.hasAttacked?'Acted ✓':label}</button>`;
            }
            const targets = validSkillTargets(u, skill);
            return `<button class="${b.mode===skill.key?'primary':''}" onclick="setMode('${skill.key}')" ${b.hasAttacked||targets.length===0?'disabled':''}>${b.hasAttacked?'Acted ✓':label}</button>`;
          })()}
          <button onclick="endTurn()">End Turn</button>
        </div>
        ${u.canHeal&&tagInfoOpen(`u${u.id}-healinfo`)?`<div class="taginfo open">Restores 2-4 HP to an ally (random, flat -- does not scale with level).</div>`:''}
        ${u.canCast&&tagInfoOpen(`u${u.id}-castinfo`)?`<div class="taginfo open">Bolt power ${3+(u.veteranLevel||0)*2} (3 + veteran level x2). Damage = power minus half the target's DEF, plus/minus 1-2 variance, minimum 1. Ignores half the target's armor and doesn't use your weapon or ATK stat.</div>`:''}
        <small class="hint">One move and one attack/ability per turn, in either order. Moving away from an adjacent enemy provokes a free strike. ^ high ground (+1 DEF while held) · ~ difficult terrain (costs double movement)</small>
      </div>`;
  }
  const roundLabel = (b.missionType==='defense'||b.missionType==='trial') ? `Round ${b.round}/${b.roundsRequired}` : `Round ${b.round}`;
  const statusRow = (uu)=>{
    const cls = uu.side==='player' ? 'statusrow me' : 'statusrow en';
    const active = (u && uu.id===u.id) ? ' active' : '';
    const tags = `${uu.side==='player'&&uu.weaponKey?`<span class="tag">${WEAPONS[uu.weaponKey].label}</span>`:''}${uu.side==='player'&&getClassName(uu)?`<span class="tag">${getFullClassName(uu)}</span>`:''}${uu.canHeal?'<span class="tag" style="color:var(--good);border-color:var(--good)">✚</span>':''}${uu.canCast?'<span class="tag" style="color:var(--corrupt);border-color:var(--corrupt)">✦</span>':''}${uu.isBoss?'<span class="tag" style="color:var(--blood);border-color:var(--blood)">☠</span>':''}`;
    const statSpan = (label, val, stat) => {
      const dir = statModDirection(uu, stat);
      const color = dir==='buff' ? 'var(--good)' : dir==='debuff' ? 'var(--blood)' : 'inherit';
      return `${label} <span style="color:${color}">${val}</span>`;
    };
    const expanded = G.battle.expandedUnitId===uu.id ? `<div class="statusdetail">${statSpan('ATK',uu.atk,'atk')} · ${statSpan('DEF',uu.def,'def')} · ${statSpan('AGI',uu.init,'init')} · ${statSpan('Move',uu.move,'move')} · Range ${uu.range}${mutationsTooltip(uu)?'<br>'+mutationsTooltip(uu).split('\n').join('<br>'):''}</div>` : '';
    const portrait = uu.side==='enemy' ? portraitBox(uu.isBoss?'boss':uu.baseType, uu.isBoss?'☠':((uu.baseType||'?')[0]), 'portrait-sm') : '';
    return `<div class="${cls}${active}" onclick="toggleUnitExpand(${uu.id})" style="display:flex;align-items:flex-start">
      ${portrait}
      <div style="flex:1;min-width:0">
        <div class="statusname">${uu.name} ${tags}</div>
        <div class="barouter"><div class="barinner" style="width:${100*uu.hp/uu.maxhp}%;background:${hpBarColor(uu.hp,uu.maxhp)}"></div></div>
        <div class="statushp">${uu.hp}/${uu.maxhp}</div>
        ${expanded}
      </div>
    </div>`;
  };
  const allyRows = b.units.filter(uu=>uu.side==='player'&&uu.alive).map(statusRow).join('');
  const enemyRows = b.units.filter(uu=>uu.side==='enemy'&&uu.alive).map(statusRow).join('');
  el.innerHTML=`
    <div class="battlelayout">
      <div class="card battlegrid-card">
        <h2>${G.activeMission.name} <span class="tag">${TYPE_LABELS[G.activeMission.type]}</span> <span class="tag">${MISSION_SETTINGS[G.activeMission.setting].name}</span> — ${roundLabel}</h2>
        <small class="hint" style="margin:0">${MISSION_OBJECTIVE_TEXT[G.activeMission.type]}</small>
        <div class="gridwrap"><div class="grid" style="grid-template-columns:repeat(${GW},var(--cell-size))">${cells}</div></div>
        ${b.tileInfoMsg ? `<small class="hint" style="color:var(--ember)">▓ ${b.tileInfoMsg}</small>` : ''}
        <div class="taglegend" style="margin-top:6px">
          <small class="hint" style="cursor:pointer" onclick="toggleTerrainLegend()">🗺 Battle Key ${G.terrainLegendExpanded?'(click to collapse)':'(click to expand)'}</small>
          ${G.terrainLegendExpanded ? `
          <div class="taginfo open" style="max-height:240px">
            <b>~</b> Difficult Terrain — costs an extra step of movement to enter<br>
            <b>▓ █ ▲ ♣ ♠</b> Obstacles (rubble, walls, rock, bramble, trees) — block movement; some also block line of sight for ranged attacks<br>
            <b>^</b> High Ground — +1 DEF while standing on it<br>
            <b>✦</b> Objective — mission objective marker<br>
            <b>Light:</b> Lit tiles — anyone can attack here. Dim tiles — melee's fine, but ranged attacks can't target here unless the attacker is a Duskhunter. Fog — undiscovered, could be hiding anything.
          </div>` : ''}
        </div>
        <div class="initstrip">${initStrip}</div>
      </div>
      <div class="battleinfo-row">
        <div class="card">${unitPanel}</div>
        <div class="card">
          <h2>Company</h2><div class="statuslist">${allyRows}</div>
          <h2 style="margin-top:10px">Enemies</h2><div class="statuslist">${enemyRows}</div>
        </div>
        <div class="card"><h2>Battle Log</h2><div class="log">${b.log.map(l=>{
          const m = l.msg.match(/^(.+?) uses (.+?)!$/);
          const ability = m ? ABILITY_LOOKUP[m[2]] : null;
          if(!ability) return {html:`<div class="${l.cls}">${l.msg}</div>`};
          const t = tappableTag(`logability-${l.id}`, l.msg, describeAbility(ability), undefined, 'max-height:180px');
          return {html:`<div class="${l.cls}">${t.tagHtml}</div>${t.panelHtml}`};
        }).reverse().map(o=>o.html).join('')}</div></div>
      </div>
    </div>`;
}

function renderResult(){
  const el=document.getElementById('screenResult');
  const r=G.result;
  const pending = G.roster.filter(x=>x.pendingChoice);
  const abilityPending = G.roster.filter(x=>x.pendingAbilityChoice);
  const choiceHtml = pending.map(p=>`
    <div class="questitem">
      <b>${p.name}</b> reached ${getClassName(p)} Lv.${p.veteranLevel} — choose their training:
      <div class="hint" style="margin-top:4px">${WEAPONS[p.weaponKey].label} · ATK ${p.atk} · DEF ${p.def} · AGI ${p.init} · Move ${p.move} · HP ${p.hp}/${p.maxhp}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        <button onclick="applyLevelChoice(${p.id},'atk')">Hone Strikes (+2 ATK)</button>
        <button onclick="applyLevelChoice(${p.id},'def')">Harden Guard (+2 DEF)</button>
        <button onclick="applyLevelChoice(${p.id},'hybrid')">Sharpen Reflexes (+1 AGI, +1 DEF)</button>
      </div>
    </div>`).join('');
  const abilityChoiceHtml = abilityPending.map(p=>{
    const options = BUFF_ABILITIES.filter(a=>a.class===getClassName(p));
    return `<div class="questitem">
      <b>${p.name}</b> has grown skilled enough to specialize — choose their signature ability (this is permanent):
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        ${options.map(a=>{
          const statsForLabel = a.stats || [a.stat];
          const statLabel = statsForLabel.map(s=>statAbbrev(s)).join('&');
          const effectLabel = a.setToZero ? `${statLabel}\u21920` : `${a.amount>0?'+':''}${a.amount} ${statLabel}`;
          const pct = Math.round((a.dmgPct!==undefined?a.dmgPct:DEFAULT_ABILITY_DAMAGE_PCT)*100);
          return `<button onclick="applyAbilityChoice(${p.id},'${a.key}')">${a.name} (${pct}% dmg, ${effectLabel})</button>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  const specPending = G.roster.filter(x=>x.pendingSpecializationChoice);
  const specChoiceHtml = specPending.map(p=>{
    const options = SPECIALIZATION_SKILLS.filter(s=>s.class===getClassName(p));
    return `<div class="questitem">
      <b>${p.name}</b> has mastered their training — choose a specialization (this is permanent, and renames their class):
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        ${options.map(s=>`<button onclick="applySpecializationChoice(${p.id},'${s.specName}')">${s.specName} — ${s.name} (${describeSkill(s)})</button>`).join('')}
      </div>
    </div>`;
  }).join('');
  const foundItemsHtml = (r.foundItems && r.foundItems.length) ? `
      <p><b>Trinkets Found:</b></p>
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">
        ${r.foundItems.map(f=>{
          const effectText = Object.keys(f.item.mod).map(st=>`${f.item.mod[st]>0?'+':''}${f.item.mod[st]} ${statAbbrev(st)}`).join(', ');
          return `<div class="tag" style="text-align:left;padding:6px 8px"><b style="color:var(--ember)">${f.item.name}</b> (${effectText}) — found by ${f.recruitName}<br><small class="hint">${f.item.flavor}</small></div>`;
        }).join('')}
      </div>` : '';
  el.innerHTML=`
    <div class="card rescreen">
      <h2>Expedition Report</h2>
      <b class="${r.win?'win':'lose'}">${r.win?'VICTORY':'EXPEDITION FAILED'}</b>
      <p>${r.mission.name}</p>
      <p><b>Fallen:</b> ${r.fallen.length? r.fallen.map(f=>f.name+' the '+f.bg.name).join(', ') : 'None. The light holds.'}</p>
      <p><b>Returned:</b> ${r.survivors.length? r.survivors.map(s=>s.name).join(', ') : 'No one.'}</p>
      <p><b>Reward:</b> ${r.win? r.mission.reward.gold+' gold, '+r.mission.reward.rep+' reputation' : Math.floor(r.mission.reward.gold*0.25)+' gold (salvage), -2 reputation'}</p>
      ${foundItemsHtml}
      ${choiceHtml ? `<h2>Training</h2>${choiceHtml}` : ''}
      ${abilityChoiceHtml ? `<h2>Signature Ability</h2>${abilityChoiceHtml}` : ''}
      ${specChoiceHtml ? `<h2>Specialization</h2>${specChoiceHtml}` : ''}
      <button class="primary" onclick="returnToPatron()" ${(pending.length||abilityPending.length||specPending.length)?'disabled':''}>${(pending.length||abilityPending.length||specPending.length)?'Resolve training above to continue':'Return to the Beacon'}</button>
    </div>`;
}

window.addEventListener('DOMContentLoaded', startNewCampaign);
</script>
</body>
</html>
